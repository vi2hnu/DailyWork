<p>user-list works!</p>
<table>
  <tr *ngFor="let user of users">
    <td>{{ user.id }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>
      <button (click)="deleteUser(user.id)">Delete</button>
    </td>
    <td>
      <button (click)="editUser(user.id)">Edit</button>
    </td>
  </tr>
</table>
